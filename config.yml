package pl.wymiana.listener;

import org.bukkit.entity.Player;
import org.bukkit.event.EventHandler;
import org.bukkit.event.EventPriority;
import org.bukkit.event.Listener;
import org.bukkit.event.entity.PlayerDeathEvent;
import org.bukkit.event.player.PlayerJoinEvent;
import org.bukkit.event.player.PlayerKickEvent;
import org.bukkit.event.player.PlayerQuitEvent;
import org.bukkit.event.player.PlayerTeleportEvent;
import pl.wymiana.Main;
import pl.wymiana.session.WymianaSession;

/**
 * Obsługa zdarzeń gracza: wejście, wyjście, kick, śmierć i teleportacja.
 */
public final class PlayerListener implements Listener {

    private final Main plugin;

    public PlayerListener(Main plugin) {
        this.plugin = plugin;
    }

    /**
     * Wydanie zaległych przedmiotów po ponownym połączeniu.
     */
    @EventHandler(priority = EventPriority.MONITOR)
    public void onJoin(PlayerJoinEvent event) {
        Player player = event.getPlayer();
        if (!plugin.isEnabled()) return;
        plugin.getServer().getScheduler().runTaskLater(plugin,
                () -> plugin.getWymianaManager().deliverPendingReturns(player), 20L);
    }

    @EventHandler(priority = EventPriority.MONITOR)
    public void onQuit(PlayerQuitEvent event) {
        plugin.getWymianaManager().onPlayerQuit(event.getPlayer());
    }

    @EventHandler(priority = EventPriority.MONITOR)
    public void onKick(PlayerKickEvent event) {
        plugin.getWymianaManager().onPlayerQuit(event.getPlayer());
    }

    @EventHandler(priority = EventPriority.MONITOR)
    public void onDeath(PlayerDeathEvent event) {
        plugin.getWymianaManager().onPlayerDeath(event.getEntity());
    }

    /**
     * Teleportacja do innego świata podczas wymiany bezpiecznie ją kończy.
     */
    @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
    public void onTeleport(PlayerTeleportEvent event) {
        if (event.getTo() == null) return;
        if (event.getFrom().getWorld() == null) return;
        if (event.getFrom().getWorld().equals(event.getTo().getWorld())) return;

        WymianaSession session = plugin.getWymianaManager().getSession(event.getPlayer().getUniqueId());
        if (session != null) {
            plugin.getWymianaManager().cancelSession(session, "trade.cancelled-self");
        }
    }
}
